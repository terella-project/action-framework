name: Auto Tag


on:
  push:
    branches: [main]
    paths:
      - "bun.lock"
      - "package-lock.json"
      - "yarn.lock"
      - "pnpm-lock.yaml"
  # Dependabot auto-merge uses GITHUB_TOKEN, which does not fire push
  # workflows. pull_request_target closed still runs and can tag.
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which component to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: auto-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release):')) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build actions
        uses: terella-project/build-actions@v1
        with:
          path: actions

      - name: Bump version and tag
        uses: ./actions/auto-tag
        with:
          bump: ${{ github.event.inputs.bump || 'patch' }}
