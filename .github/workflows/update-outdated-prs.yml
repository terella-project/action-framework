name: Update outdated PR branches

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build actions
        uses: terella-project/build-actions@v1
        with:
          path: actions

      - uses: ./actions/update-outdated-prs
        env:
          # RELEASE_TOKEN (fine-grained PAT) lacked pull-request comment
          # permission and failed @dependabot rebase. GITHUB_TOKEN works
          # with this workflow's pull-requests: write permission.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
