name: Dependabot auto-merge

# pull_request_target (not pull_request): Dependabot PRs cannot read Actions
# secrets on pull_request. Merges must use RELEASE_TOKEN — GITHUB_TOKEN merges
# are attributed to github-actions[bot] and suppress push / pull_request_target
# workflows, so Auto Tag never runs after Dependabot lands.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Base branch only — never checkout the PR head on pull_request_target.
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build actions
        uses: terella-project/build-actions@v1
        with:
          path: actions

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}

      - name: Enable auto-merge for non-major updates
        if: >-
          steps.metadata.outputs.dependency-group != 'bun-major' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: ./actions/dependabot-auto-merge
        with:
          dependency-group: ${{ steps.metadata.outputs.dependency-group }}
          update-type: ${{ steps.metadata.outputs.update-type }}
          pr-url: ${{ github.event.pull_request.html_url }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
