name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build actions
        uses: terella-project/build-actions@v1
        with:
          path: actions

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          # Dependabot PRs only receive Dependabot secrets, not Actions
          # secrets like RELEASE_TOKEN — use the workflow GITHUB_TOKEN.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for non-major updates
        if: >-
          steps.metadata.outputs.dependency-group != 'bun-major' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: ./actions/dependabot-auto-merge
        with:
          dependency-group: ${{ steps.metadata.outputs.dependency-group }}
          update-type: ${{ steps.metadata.outputs.update-type }}
          pr-url: ${{ github.event.pull_request.html_url }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
