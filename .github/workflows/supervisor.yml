name: Supervisor

on:
  schedule:
    - cron: "0 14 * * 1"  # Monday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: weekly-unstick
  cancel-in-progress: false

jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build actions
        uses: terella-project/build-actions@v1
        with:
          path: actions

      - uses: ./actions/supervisor
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
